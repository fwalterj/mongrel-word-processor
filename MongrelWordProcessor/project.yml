name: MongrelWordProcessor
options:
  bundleIdPrefix: com.mongrel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  SharedFoundation:
    path: Packages/SharedFoundation

targets:
  MongrelWordProcessor:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: App

    resources:
      - path: App/Resources

    dependencies:
      - package: SharedFoundation
      - sdk: PDFKit.framework
      - sdk: UniformTypeIdentifiers.framework

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.wordprocessor
        PRODUCT_NAME: MongrelWordProcessor
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: App/MongrelWordProcessor.entitlements
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mongrel Word Processor
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mongrel"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_STRICT_CONCURRENCY: complete
        EXCLUDED_ARCHS[sdk=macosx*]: ""
        ARCHS: "$(ARCHS_STANDARD)"

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES
          STRIP_INSTALLED_PRODUCT: YES

  MongrelWordProcessorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Tests

    dependencies:
      - target: MongrelWordProcessor

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.wordprocessor.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        SWIFT_STRICT_CONCURRENCY: complete
